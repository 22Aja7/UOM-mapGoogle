<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University of Mumbai Navigation</title>
    <link rel="stylesheet" href="map.css">
</head>
<body>
<h1>University of Mumbai Navigation</h1>
<p>Enter where you are:</p>
<input name="start_point" type="search" placeholder="Search starting point">
<select name="start">
<option value="" disabled selected>Choose start</option> 
</select>
<p>Where do you want to reach?</p>
<input type="search" name="end_point" placeholder="Search destination">
<select name="end">
    <option value="" disabled selected>Choose Destination</option>    
</select>
<button id="map_direction">Get Directions</button>
<script src="main.js"></script>
</body>
</html>
